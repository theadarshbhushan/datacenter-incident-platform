global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # API process metrics (request rates, latencies) exposed by dc-backend at /metrics.
  - job_name: 'backend'
    static_configs:
      - targets: ['dc-backend:8000']
