# VaultWatch in production. See docs/DEPLOYMENT.md.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Needs DOMAIN, SECRET_KEY and MONGO_URI in .env. Port 8000 stays private: everything goes through Caddy.

services:
  dc-backend:
    build:
      context: ./dc-backend
      additional_contexts:
        ingestion: ./dc-ingestion
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      MONGO_URI: ${MONGO_URI:?set MONGO_URI in .env}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-vaultwatch}
      FRONTEND_URL: ${PUBLIC_URL:-https://${DOMAIN:?set DOMAIN in .env}}
      CORS_ORIGINS: ${PUBLIC_URL:-https://${DOMAIN}}
      TRUST_PROXY_HEADERS: "true"
    networks: [dc-network]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  web:
    build:
      context: ./dc-frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    depends_on:
      dc-backend:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-${DOMAIN}}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
    networks: [dc-network]

networks:
  dc-network:

volumes:
  caddy_data:
