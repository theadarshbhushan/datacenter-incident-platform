# VaultWatch services.
#
#   docker compose up --build                                  # backend + frontend, database from MONGO_URI (e.g. MongoDB Atlas)
#   docker compose --profile local-db up --build               # also start a local MongoDB container
#   docker compose --profile agent up                          # also run a simulated telemetry fleet (testing only)
#   docker compose --profile observability up                  # also Prometheus + Grafana
#
# Every value comes from the root .env (copy .env.example). Nothing secret is hard-coded here.

services:
  dc-backend:
    build:
      context: ./dc-backend
    container_name: dc-backend
    restart: unless-stopped
    env_file:
      - .env          # SECRET_KEY (or the older JWT_SECRET) and the optional SMTP/Slack/PagerDuty settings come from here
    environment:
      # Atlas: mongodb+srv://USER:PASSWORD@cluster.xxxxx.mongodb.net/?retryWrites=true&w=majority
      # local-db profile: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/?authSource=admin
      MONGO_URI: ${MONGO_URI:?set MONGO_URI in .env (Atlas connection string, or the local-db profile URI)}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-vaultwatch}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks: [dc-network]
    healthcheck:
      # Readiness: database reachable and model loaded.
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  dc-frontend:
    build:
      context: ./dc-frontend
    container_name: dc-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      # The browser talks to the Vite dev server, which proxies /api to the backend container,
      # so the session cookie stays first-party on http://localhost:5173.
      VITE_API_MODE: ${VITE_API_MODE:-api}
      VITE_API_URL: ""
      VITE_PROXY_TARGET: http://dc-backend:8000
    depends_on:
      dc-backend:
        condition: service_healthy
    networks: [dc-network]

  mongodb:
    profiles: ["local-db"]
    image: mongo:7.0
    container_name: dc-mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-vaultwatch}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-}   # required for the local-db profile
    volumes:
      - mongodb_data:/data/db
    networks: [dc-network]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  agent:
    profiles: ["agent"]
    build:
      context: ./dc-ingestion
    container_name: dc-agent
    restart: unless-stopped
    environment:
      VAULTWATCH_URL: http://dc-backend:8000
      VAULTWATCH_API_KEY: ${AGENT_API_KEY:-}   # create a key in Integrations; the agent exits with a message if unset
    depends_on:
      dc-backend:
        condition: service_healthy
    networks: [dc-network]

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v2.51.0
    container_name: dc-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [dc-network]

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:10.4.0
    container_name: dc-grafana
    restart: unless-stopped
    depends_on: [prometheus]
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}   # required for the observability profile
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    networks: [dc-network]

networks:
  dc-network:
    name: dc-network

volumes:
  mongodb_data:
  prometheus_data:
  grafana_data:
